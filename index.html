<!doctype html>
<html>
  <head>
    <title>FrostPrime Decklist Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

  </head>
  <body>
    <video autoplay muted loop id="bg-video" poster="bg.png">
      <source src="bg.mp4" type="video/mp4">
    </video>
    <script src="CardData.js"></script>
    <script src="script.js"></script>
    <button id='refresh' onClick='refreshVisibleDecks()'>⟳ Refresh</button>
    <label id="auto-refresh-label">
        <input type="checkbox" id="auto-refresh-checkbox"> Auto Refresh
    </label>
    <select id="contestant-selector">
        <option value="" disabled selected>Select a player</option>
    </select>
    <p id='title'>Decklists:</p>
    <div id='decklists'>
        <div id='contestant-btns'></div>
        <div id='deck-container'></div>
    </div>
  </body>
</html>
